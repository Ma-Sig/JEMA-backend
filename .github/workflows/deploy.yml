name: Deploy Workflow

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    environment: jema-environment

    steps:
      - name: Check out code
        uses: actions/checkout@v2  # Clona el repositorio

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_SCHEMA=${{ secrets.DB_SCHEMA }}" >> .env

      - name: Run backend in background
        run: npm run dev &  # Esto ejecutará el servidor en segundo plano

      - name: Wait for backend to be ready
        run: |
          # Esperar a que el backend esté disponible (puedes usar curl o nc)
          echo "Waiting for backend to be ready..."
          while ! curl -s http://localhost:3000 > /dev/null; do
            echo "Waiting for server..."
            sleep 60
          done

      - name: Add execute permissions to tests script
        run: chmod +x ./run-tests.sh

      - name: Run tests
        run: npm run test:linux